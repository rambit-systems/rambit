[package]
edition = "2021"
name = "site-app"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
leptos = { workspace = true, features = [ "ssr", "tracing" ] }
leptos_axum.workspace = true
leptos_router = { workspace = true, features = [ "ssr" ] }

auth-domain = { path = "../auth-domain" }
css-minify-macro = { path = "../css-minify-macro" }
domain = { path = "../domain" }
grid-state = { path = "../grid-state" }
models = { path = "../models" }
site-paddle = { path = "../site-paddle" }

axum.workspace = true
futures.workspace = true

serde.workspace = true
tracing.workspace = true

const_base = "0.2.0"
leptos-fetch = { version = "0.4", features = [ "ssr" ] }
leptos-use = { version = "0.16", default-features = false, features = [
  "on_click_outside",
  "signal_throttled",
  "use_event_listener",
  "use_window",
  "use_interval_fn",
  "use_window_focus",
  "use_clipboard",
] }

const_format = "0.2"
